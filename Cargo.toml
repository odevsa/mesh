[package]
name = "mesh"
version = "0.1.6"
edition = "2024"

[dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
winit = { version = "0.30", default-features = false, features = ["x11"] }
egui-wgpu = "0.34"
egui = "0.34"
glam = "0.29"
bytemuck = { version = "1.21", features = ["derive"] }
nalgebra = "0.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
pollster = "0.4"
rfd = "0.14"
stl_io = "0.5"
tobj = "2.0"
gltf = "1.4"
quick-xml = "0.29"
zip = "0.6"
image = "0.25"
sys-locale = "0.3"
ufbx = "0.7"

[features]
default = []

[build-dependencies]
winres = "0.1"

[package.metadata.winres]

[package.metadata.deb]
assets = [
    ["target/release/mesh", "usr/bin/mesh", "755"],
    ["packaging/linux/mesh.desktop", "usr/share/applications/mesh.desktop", "644"],
    ["packaging/linux/assets/icons/16x16/apps/mesh.png", "usr/share/icons/hicolor/16x16/apps/mesh.png", "644"],
    ["packaging/linux/assets/icons/32x32/apps/mesh.png", "usr/share/icons/hicolor/32x32/apps/mesh.png", "644"],
    ["packaging/linux/assets/icons/64x64/apps/mesh.png", "usr/share/icons/hicolor/64x64/apps/mesh.png", "644"],
    ["packaging/linux/assets/icons/128x128/apps/mesh.png", "usr/share/icons/hicolor/128x128/apps/mesh.png", "644"],
    ["packaging/linux/assets/icons/256x256/apps/mesh.png", "usr/share/icons/hicolor/256x256/apps/mesh.png", "644"],
    ["packaging/linux/assets/icons/512x512/apps/mesh.png", "usr/share/icons/hicolor/512x512/apps/mesh.png", "644"],
    ["packaging/linux/assets/icons/hicolor/scalable/apps/mesh.svg", "usr/share/icons/hicolor/scalable/apps/mesh.svg", "644"],
]
