[package]
name = "mesh"
version = "0.1.0"
edition = "2024"

[dependencies]
kiss3d = "0.45"
nalgebra = "0.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
pollster = "0.4"
rfd = "0.14"
stl_io = "0.5"
tobj = "2.0"
gltf = "1.4"
quick-xml = "0.29"
zip = "0.6"

[features]
default = []

[build-dependencies]
winres = "0.1"

[package.metadata.winres]

[package.metadata.deb]
assets = [
    ["target/release/mesh", "usr/bin/mesh", "755"],
    ["assets/mesh.desktop", "usr/share/applications/mesh.desktop", "644"],
    ["assets/icons/16x16/apps/mesh.png", "usr/share/icons/hicolor/16x16/apps/mesh.png", "644"],
    ["assets/icons/32x32/apps/mesh.png", "usr/share/icons/hicolor/32x32/apps/mesh.png", "644"],
    ["assets/icons/64x64/apps/mesh.png", "usr/share/icons/hicolor/64x64/apps/mesh.png", "644"],
    ["assets/icons/128x128/apps/mesh.png", "usr/share/icons/hicolor/128x128/apps/mesh.png", "644"],
    ["assets/icons/256x256/apps/mesh.png", "usr/share/icons/hicolor/256x256/apps/mesh.png", "644"],
    ["assets/icons/512x512/apps/mesh.png", "usr/share/icons/hicolor/512x512/apps/mesh.png", "644"],
]
