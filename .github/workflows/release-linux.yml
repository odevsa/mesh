name: Release Linux

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: mesh

jobs:
  build-linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb_arch: amd64
            appimage_arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - arch: arm64
            deb_arch: arm64
            appimage_arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Define Package Names
        id: names
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ARCH="${{ matrix.arch }}"
          APP_NAME="${{ env.APP_NAME }}"
          echo "TAR_NAME=${APP_NAME}-${VERSION}-linux-${ARCH}.tar.xz" >> $GITHUB_OUTPUT
          echo "DEB_NAME=${APP_NAME}-${VERSION}-linux-${ARCH}.deb" >> $GITHUB_OUTPUT
          echo "APPIMAGE_NAME=${APP_NAME}-${VERSION}-linux-${ARCH}.AppImage" >> $GITHUB_OUTPUT

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config imagemagick librsvg2-bin xz-utils libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Generate icons
        run: |
          chmod +x packaging/scripts/generate-icons.sh packaging/scripts/make_icns.py
          ./packaging/scripts/generate-icons.sh

      - name: Package DEB, Tar.xz & AppImage
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ARCH="${{ matrix.arch }}"
          APP_NAME="${{ env.APP_NAME }}"
          BINARY="target/${{ matrix.target }}/release/${APP_NAME}"
          mkdir -p dist

          # -----------------------------------------------------------------
          # 1. Debian Package (.deb)
          # -----------------------------------------------------------------
          DEB_DIR="dist/${APP_NAME}-deb-${{ matrix.deb_arch }}"
          mkdir -p "${DEB_DIR}/usr/bin"
          mkdir -p "${DEB_DIR}/usr/share/applications"
          mkdir -p "${DEB_DIR}/usr/share/icons/hicolor"
          mkdir -p "${DEB_DIR}/DEBIAN"

          install -m 755 "${BINARY}" "${DEB_DIR}/usr/bin/${APP_NAME}"
          install -m 644 "packaging/linux/${APP_NAME}.desktop" "${DEB_DIR}/usr/share/applications/${APP_NAME}.desktop"
          cp -r packaging/linux/assets/icons/hicolor/* "${DEB_DIR}/usr/share/icons/hicolor/"

          {
            echo "Package: ${APP_NAME}"
            echo "Version: ${VERSION}"
            echo "Section: graphics"
            echo "Priority: optional"
            echo "Architecture: ${{ matrix.deb_arch }}"
            echo "Maintainer: Odevsa <dev.raphaelsa@gmail.com>"
            echo "Depends: libc6, libgcc-s1"
            echo "Homepage: https://github.com/odevsa/mesh"
            echo "Description: Fast, lightweight 3D mesh and model viewer written in Rust"
            echo " Mesh provides a high-performance 3D model viewer supporting STL, 3MF, OBJ, GLTF, GLB, and FBX formats."
          } > "${DEB_DIR}/DEBIAN/control"

          dpkg-deb -Zxz --build "${DEB_DIR}" "dist/${{ steps.names.outputs.DEB_NAME }}"
          rm -rf "${DEB_DIR}"

          # -----------------------------------------------------------------
          # 2. Portable Archive (.tar.xz)
          # -----------------------------------------------------------------
          TAR_DIR="dist/${APP_NAME}-${VERSION}-linux-${ARCH}"
          mkdir -p "${TAR_DIR}/bin"
          mkdir -p "${TAR_DIR}/share/applications"
          mkdir -p "${TAR_DIR}/share/icons/hicolor"

          install -m 755 "${BINARY}" "${TAR_DIR}/bin/${APP_NAME}"
          install -m 644 "packaging/linux/${APP_NAME}.desktop" "${TAR_DIR}/share/applications/${APP_NAME}.desktop"
          cp -r packaging/linux/assets/icons/hicolor/* "${TAR_DIR}/share/icons/hicolor/"
          if [ -f README.md ]; then cp README.md "${TAR_DIR}/"; fi

          (cd dist && tar -cJf "${{ steps.names.outputs.TAR_NAME }}" "${APP_NAME}-${VERSION}-linux-${ARCH}")
          rm -rf "${TAR_DIR}"

          # -----------------------------------------------------------------
          # 3. Linux AppImage (.AppImage)
          # -----------------------------------------------------------------
          APPDIR="dist/AppDir"
          mkdir -p "${APPDIR}/usr/bin"
          mkdir -p "${APPDIR}/usr/share/applications"
          mkdir -p "${APPDIR}/usr/share/icons/hicolor"

          install -m 755 "${BINARY}" "${APPDIR}/usr/bin/${APP_NAME}"
          install -m 644 "packaging/linux/${APP_NAME}.desktop" "${APPDIR}/${APP_NAME}.desktop"
          install -m 644 "packaging/linux/${APP_NAME}.desktop" "${APPDIR}/usr/share/applications/${APP_NAME}.desktop"
          cp "packaging/linux/assets/${APP_NAME}.png" "${APPDIR}/${APP_NAME}.png"
          ln -sf "${APP_NAME}.png" "${APPDIR}/.DirIcon"
          cp -r packaging/linux/assets/icons/hicolor/* "${APPDIR}/usr/share/icons/hicolor/"

          ln -sf "usr/bin/${APP_NAME}" "${APPDIR}/AppRun"

          curl -L -f --retry 3 "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage_arch }}.AppImage" -o /tmp/appimagetool || \
          curl -L -f --retry 3 "https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-${{ matrix.appimage_arch }}.AppImage" -o /tmp/appimagetool
          chmod +x /tmp/appimagetool

          export ARCH="${{ matrix.appimage_arch }}"
          /tmp/appimagetool --appimage-extract-and-run "${APPDIR}" "dist/${{ steps.names.outputs.APPIMAGE_NAME }}" || true
          rm -rf "${APPDIR}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesh-linux-${{ matrix.arch }}
          path: dist/*

      - name: Upload to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          gh release upload "${TAG}" dist/* --clobber
