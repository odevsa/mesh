name: Release Linux

on:
  release:
    types: [created, published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: mesh

jobs:
  build:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            arch_appimage: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            arch_appimage: aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils xz-utils libfuse2 file curl

      - name: Install cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Extract Version
        id: get_version
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION=$(grep '^version =' Cargo.toml | head -n1 | cut -d '"' -f 2)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Define Package Names
        id: names
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ARCH="${{ matrix.arch }}"
          APP_NAME="${{ env.APP_NAME }}"
          echo "TAR_NAME=${APP_NAME}-${VERSION}-linux-${ARCH}.tar.xz" >> $GITHUB_OUTPUT
          echo "DEB_NAME=${APP_NAME}-${VERSION}-linux-${ARCH}.deb" >> $GITHUB_OUTPUT
          echo "APPIMAGE_NAME=${APP_NAME}-${VERSION}-linux-${ARCH}.AppImage" >> $GITHUB_OUTPUT

      - name: Package .tar.xz
        run: |
          ARCH="${{ matrix.arch }}"
          APP_NAME="${{ env.APP_NAME }}"
          STAGE_DIR="stage_linux_${ARCH}"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/icons"

          cp "target/${{ matrix.target }}/release/${APP_NAME}" "$STAGE_DIR/"
          chmod +x "$STAGE_DIR/${APP_NAME}"
          cp "assets/${APP_NAME}.desktop" "$STAGE_DIR/"
          cp "assets/icons/512x512/apps/${APP_NAME}.png" "$STAGE_DIR/"
          cp -r assets/icons/* "$STAGE_DIR/icons/"

          tar -cJf "${{ steps.names.outputs.TAR_NAME }}" -C "$STAGE_DIR" .
          rm -rf "$STAGE_DIR"

      - name: Package .deb
        run: |
          APP_NAME="${{ env.APP_NAME }}"
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/${APP_NAME}" "target/release/${APP_NAME}"
          cargo deb --target ${{ matrix.target }} --no-build --output "${{ steps.names.outputs.DEB_NAME }}"

      - name: Package AppImage
        run: |
          APP_NAME="${{ env.APP_NAME }}"
          APPIMAGE_ARCH="${{ matrix.arch_appimage }}"
          APPIMAGETOOL_URL="https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGE_ARCH}.AppImage"

          curl -sL "$APPIMAGETOOL_URL" -o appimagetool.AppImage
          chmod +x appimagetool.AppImage

          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps
          mkdir -p AppDir/usr/share/applications

          cp "target/${{ matrix.target }}/release/${APP_NAME}" "AppDir/usr/bin/${APP_NAME}"
          chmod +x "AppDir/usr/bin/${APP_NAME}"

          cp "assets/${APP_NAME}.desktop" "AppDir/${APP_NAME}.desktop"
          cp "assets/${APP_NAME}.desktop" "AppDir/usr/share/applications/${APP_NAME}.desktop"
          cp "assets/icons/512x512/apps/${APP_NAME}.png" "AppDir/usr/share/icons/hicolor/512x512/apps/${APP_NAME}.png"
          cp "assets/icons/512x512/apps/${APP_NAME}.png" "AppDir/${APP_NAME}.png"
          cp "assets/icons/512x512/apps/${APP_NAME}.png" "AppDir/.DirIcon"

          ln -s "usr/bin/${APP_NAME}" "AppDir/AppRun"

          ARCH="${APPIMAGE_ARCH}" APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage AppDir "${{ steps.names.outputs.APPIMAGE_NAME }}"
          rm -rf AppDir appimagetool.AppImage

      - name: Upload Artifacts (Local or CI)
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            ${{ steps.names.outputs.TAR_NAME }}
            ${{ steps.names.outputs.DEB_NAME }}
            ${{ steps.names.outputs.APPIMAGE_NAME }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            ${{ steps.names.outputs.TAR_NAME }}
            ${{ steps.names.outputs.DEB_NAME }}
            ${{ steps.names.outputs.APPIMAGE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
