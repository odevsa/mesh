name: Release Windows

on:
  release:
    types: [created, published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: mesh

jobs:
  build:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x86_64
          - target: aarch64-pc-windows-msvc
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Extract Version
        id: get_version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/ ]]; then
            TAG="${{ github.ref }}"
            TAG="${TAG#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION=$(grep '^version =' Cargo.toml | head -n1 | cut -d '"' -f 2)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Define Package Names
        id: names
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ARCH="${{ matrix.arch }}"
          APP_NAME="${{ env.APP_NAME }}"
          echo "EXE_NAME=${APP_NAME}-${VERSION}-windows-${ARCH}.exe" >> $GITHUB_OUTPUT

      - name: Prepare Executable
        shell: bash
        run: |
          APP_NAME="${{ env.APP_NAME }}"
          BIN_PATH="target/${{ matrix.target }}/release/${APP_NAME}.exe"
          cp "$BIN_PATH" "${{ steps.names.outputs.EXE_NAME }}"

      - name: Upload Artifacts (Local or CI)
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            ${{ steps.names.outputs.EXE_NAME }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            ${{ steps.names.outputs.EXE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
