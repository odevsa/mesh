name: Release Windows

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: mesh

jobs:
  build-windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Define Package Names
        id: names
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ARCH="${{ matrix.arch }}"
          APP_NAME="${{ env.APP_NAME }}"
          echo "EXE_NAME=${APP_NAME}-${VERSION}-windows-${ARCH}.exe" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install NSIS
        shell: bash
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH

      - name: Build release binary
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows Installer
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ARCH="${{ matrix.arch }}"
          APP_NAME="${{ env.APP_NAME }}"
          BIN_DIR="target/${{ matrix.target }}/release"
          mkdir -p dist

          # NSIS Installer (.exe)
          makensis -NOCD \
            -DVERSION="${VERSION}" \
            -DARCH="${ARCH}" \
            -DBIN_DIR="${BIN_DIR}" \
            -DASSETS_DIR="packaging/windows/assets" \
            -DOUT_DIR="dist" \
            packaging/windows/mesh.nsi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesh-windows-${{ matrix.arch }}
          path: dist/*

      - name: Upload to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          gh release upload "${TAG}" dist/* --clobber
