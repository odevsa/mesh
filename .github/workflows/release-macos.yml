name: Release macOS

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: mesh

jobs:
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Version
        id: get_version
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Define Package Names
        id: names
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ARCH="${{ matrix.arch }}"
          APP_NAME="${{ env.APP_NAME }}"
          echo "DMG_NAME=${APP_NAME}-${VERSION}-macos-${ARCH}.dmg" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Generate icons
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install imagemagick
          chmod +x packaging/scripts/generate-icons.sh
          ./packaging/scripts/generate-icons.sh --macos

      - name: Package Mesh.app & DMG
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          STAGING="dist/macos-staging"
          APP_DIR="${STAGING}/Mesh.app"
          OUTPUT_DMG="dist/${{ steps.names.outputs.DMG_NAME }}"

          mkdir -p dist
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"

          install -m 755 "target/${{ matrix.target }}/release/mesh" "${APP_DIR}/Contents/MacOS/mesh"
          install -m 644 packaging/macos/assets/mesh.icns "${APP_DIR}/Contents/Resources/mesh.icns"

          sed "s/VERSION_PLACEHOLDER/${VERSION}/g" packaging/macos/Info.plist > "${APP_DIR}/Contents/Info.plist"
          echo -n "APPL????" > "${APP_DIR}/Contents/PkgInfo"

          codesign --force --deep --sign - "${APP_DIR}"

          ln -sf /Applications "${STAGING}/Applications"

          hdiutil create \
            -volname "Mesh" \
            -srcfolder "${STAGING}" \
            -ov \
            -format UDZO \
            "${OUTPUT_DMG}"

          rm -rf "${STAGING}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesh-macos-${{ matrix.arch }}
          path: dist/*.dmg

      - name: Upload to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          gh release upload "${TAG}" dist/*.dmg --clobber
